[package]
name = "belhana-desktop"
version = "0.1.0"
description = "Belhana desktop shell (Tauri 2)"
edition = "2021"
rust-version = "1.77"

# Standalone workspace: the server/worker workspace must not be forced to
# compile the WebView toolchain just to run `cargo test --workspace`.
[workspace]

# Android builds link the Tauri runtime as a shared library. The Windows
# binary stays in main.rs and shares the same app setup through this crate.
[lib]
name = "belhana_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Release builds must be small: strip debug symbols, link-time optimise, and
# optimise for size. The debug .so was 118 MB; this brings it near the ~6-10 MB
# that a normal Tauri/Svelte mobile app ships.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
