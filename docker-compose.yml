# Optional development infrastructure for the FUTURE Postgres deployment.
# The current API build is SQLite-only (BELHANA_DATABASE_URL=belhana.db) and does
# NOT need this file. Bring Postgres up only after porting belhana-db to sqlx
# postgres and verifying the migrations (see docs/18-DEPLOYMENT.md).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: belhana
      POSTGRES_PASSWORD: belhana_dev_password
      POSTGRES_DB: belhana
    ports:
      - "5432:5432"
    volumes:
      - belhana_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U belhana"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  belhana_pgdata:
